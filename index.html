<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Asymbl Documentation Portal - Your single source of truth for all Asymbl product documentation">
    <meta name="keywords" content="Asymbl, ATS, ASM, AST, AIN, ARA, ASIN, Documentation, Integration Guide, API">
    <title>Asymbl Documentation Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <img src="ats/images/Asymbl_Logo.svg" alt="Asymbl Logo" />
        </div>
        <div class="options">
            <a href="https://asymbl.com" target="_blank">About Asymbl</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Loading State -->
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Loading documentation...</p>
        </div>

        <!-- Products Layout - Sidebar + Detail View + Releases Sidebar -->
        <div class="products-layout" id="products-layout" style="display: none;">
            <!-- Left Sidebar with all products -->
            <div class="products-sidebar">
                <h3 class="sidebar-title">All Products</h3>
                <div id="products-sidebar-list">
                    <!-- Product sidebar cards will be inserted here -->
                </div>
            </div>

            <!-- Center Detail Panel -->
            <div class="product-detail-panel" id="product-detail-panel">
                <!-- Selected product details will be inserted here -->
            </div>

            <!-- Right Releases Sidebar -->
            <div class="releases-sidebar visible" id="releases-sidebar">
                <div class="releases-sidebar-header">
                    <h3 class="releases-sidebar-title">Release History</h3>
                </div>
                <div id="releases-sidebar-content">
                    <!-- Release cards will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; 2025 Asymbl Inc. All rights reserved.</p>
        <p>For support, visit <a href="https://asymbl.com/support" target="_blank">asymbl.com/support</a></p>
    </div>

    <!-- JavaScript to load and render documentation data -->
    <script>
        let globalData = null;
        let currentFilter = 'ats';
        let selectedProductId = 'ats';

        // Fetch documentation data from JSON file
        async function loadDocumentation() {
            try {
                const response = await fetch('docs-data.json');
                if (!response.ok) {
                    throw new Error('Failed to load documentation data');
                }
                const data = await response.json();
                globalData = data;
                renderDocumentation(data);
            } catch (error) {
                console.error('Error loading documentation:', error);
                document.getElementById('loading').innerHTML = `
                    <p style="color: #dc3545;">
                        ⚠️ Unable to load documentation data. Please refresh the page or contact support.
                    </p>
                `;
            }
        }

        // Render documentation hub
        function renderDocumentation(data) {
            // Render sidebar products
            renderProductsSidebar(data);

            // Render detail panel for first product (ATS)
            const firstProduct = data.products.find(p => p.id === selectedProductId) || data.products[0];
            renderProductDetail(firstProduct);

            // Show releases for the first product
            updateReleasesSidebar(firstProduct);

            // Hide loading, show content with releases sidebar always visible
            document.getElementById('loading').style.display = 'none';
            const productsLayout = document.getElementById('products-layout');
            productsLayout.style.display = 'grid';
            productsLayout.classList.add('with-releases');
        }

        // Render products sidebar
        function renderProductsSidebar(data) {
            const sidebarList = document.getElementById('products-sidebar-list');
            sidebarList.innerHTML = '';

            data.products.forEach(product => {
                const card = createSidebarCard(product);
                sidebarList.appendChild(card);
            });
        }

        // Create sidebar card
        function createSidebarCard(product) {
            const card = document.createElement('div');
            card.className = `product-sidebar-card ${product.id === selectedProductId ? 'active' : ''}`;
            card.onclick = () => selectProduct(product.id);

            card.innerHTML = `
                <div class="sidebar-product-icon">${product.icon || '📦'}</div>
                <div class="sidebar-product-info">
                    <div class="sidebar-product-name">${product.name}</div>
                    <div class="sidebar-product-version">${product.releaseVersion || product.name}</div>
                </div>
            `;

            return card;
        }

        // Select product
        function selectProduct(productId) {
            selectedProductId = productId;

            // Update sidebar active state
            document.querySelectorAll('.product-sidebar-card').forEach(card => {
                card.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // Render product detail
            const product = globalData.products.find(p => p.id === productId);
            if (product) {
                renderProductDetail(product);
                // Also update the releases sidebar with the selected product's releases
                updateReleasesSidebar(product);
            }
        }

        // Render product detail panel
        function renderProductDetail(product) {
            const detailPanel = document.getElementById('product-detail-panel');

            const links = product.links || {};
            const docLinks = [
                { key: 'integrationGuide', icon: '📘' },
                { key: 'userGuide', icon: '📗' },
                { key: 'postDeployment', icon: '⚙️' },
                { key: 'preDeployment', icon: '⚙️' },
                { key: 'techDoc', icon: '📄' }
            ];

            const linksHTML = docLinks.map(({ key, icon }) => {
                const link = links[key];
                if (!link || !link.url) return '';

                const isDisabled = link.url === '#' || !link.url;
                const disabledClass = isDisabled ? 'disabled' : '';

                // All links open in new tab with external icon
                const target = '_blank';
                const externalIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>';

                return `
                    <a href="${link.url}"
                       class="doc-link ${disabledClass}"
                       target="${target}"
                       rel="noopener noreferrer"
                       ${isDisabled ? 'aria-disabled="true"' : ''}>
                        <span class="doc-link-icon">${icon}</span>
                        <span class="doc-link-text">${link.label || key}</span>
                        <span class="doc-link-arrow">${externalIcon}</span>
                    </a>
                `;
            }).join('');

            const gitRepos = product.gitRepositories || [];
            const cicdJobs = product.cicd || [];
            const sfOrgs = product.sfOrgs || [];

            const cicdInfoNote = `
                <div class="cicd-info-note">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <span>Redirecting to the Jenkins section below will list all relevant CI/CD jobs for this product.</span>
                </div>
            `;

            const cicdContentHTML = cicdJobs.length > 0
                ? cicdInfoNote + cicdJobs.map(job => `
                    <a href="${job.url}" target="_blank" rel="noopener noreferrer" class="doc-link ${job.url === '#' ? 'disabled' : ''}" ${job.url === '#' ? 'aria-disabled="true"' : ''}>
                        <span class="doc-link-icon">⚙️</span>
                        <div class="doc-link-body">
                            <span class="doc-link-text">${job.name}</span>
                            ${job.description ? `<span class="doc-link-description">${job.description}</span>` : ''}
                        </div>
                        <span class="doc-link-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg></span>
                    </a>
                `).join('')
                : `
                    <div class="git-empty">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem; opacity: 0.5;">
                            <circle cx="12" cy="12" r="3"/><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
                        </svg>
                        <p style="color: #999; font-size: 1rem; font-weight: 500;">No CI/CD Jobs</p>
                        <p style="color: #aaa; font-size: 0.9rem; margin-top: 0.5rem;">Jenkins job links will appear here when added</p>
                    </div>
                `;

            const sforgsContentHTML = sfOrgs.length > 0
                ? sfOrgs.map(org => `
                    <div class="doc-link sforg-item">
                        <span class="doc-link-icon">☁️</span>
                        <div class="doc-link-body">
                            <span class="doc-link-text">${org.name}</span>
                            ${org.description ? `<span class="doc-link-description">${org.description}</span>` : ''}
                        </div>
                    </div>
                `).join('')
                : `
                    <div class="git-empty">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem; opacity: 0.5;">
                            <circle cx="12" cy="12" r="3"/><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/><line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/><line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
                        </svg>
                        <p style="color: #999; font-size: 1rem; font-weight: 500;">No SF Orgs</p>
                        <p style="color: #aaa; font-size: 0.9rem; margin-top: 0.5rem;">Salesforce org details will appear here when added</p>
                    </div>
                `;

            const gitContentHTML = gitRepos.length > 0
                ? gitRepos.map(repo => `
                    <a href="${repo.url}" target="_blank" rel="noopener noreferrer" class="doc-link">
                        <span class="doc-link-icon">📁</span>
                        <span class="doc-link-text">${repo.name}</span>
                        <span class="doc-link-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg></span>
                    </a>
                `).join('')
                : `
                    <div class="git-empty">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem; opacity: 0.5;">
                            <circle cx="12" cy="12" r="3"/>
                            <line x1="12" y1="1" x2="12" y2="4"/>
                            <line x1="12" y1="20" x2="12" y2="23"/>
                            <line x1="4.22" y1="4.22" x2="6.34" y2="6.34"/>
                            <line x1="17.66" y1="17.66" x2="19.78" y2="19.78"/>
                            <line x1="1" y1="12" x2="4" y2="12"/>
                            <line x1="20" y1="12" x2="23" y2="12"/>
                            <line x1="4.22" y1="19.78" x2="6.34" y2="17.66"/>
                            <line x1="17.66" y1="6.34" x2="19.78" y2="4.22"/>
                        </svg>
                        <p style="color: #999; font-size: 1rem; font-weight: 500;">No Repositories</p>
                        <p style="color: #aaa; font-size: 0.9rem; margin-top: 0.5rem;">Git repositories will appear here when added</p>
                    </div>
                `;

            detailPanel.innerHTML = `
                <div class="detail-header">
                    <div class="detail-icon">${product.icon || '📦'}</div>
                    <div class="detail-info">
                        <h2 class="detail-product-name">${product.name}</h2>
                        <p class="detail-product-full-name">${product.fullName}</p>
                        <p class="detail-product-description">${product.description || ''}</p>
                        <span class="detail-product-version">${product.releaseVersion || product.name} • ${product.releaseDate}</span>
                        ${product.packageVersion && product.packageVersion !== 'N/A' ? `<span class="detail-package-version">Package: ${product.packageVersion}</span>` : ''}
                    </div>
                </div>
                <div class="detail-tabs">
                    <button class="detail-tab-btn active" onclick="switchTab('documentation', this)">Documentation</button>
                    <button class="detail-tab-btn" onclick="switchTab('git', this)">Git</button>
                    <button class="detail-tab-btn" onclick="switchTab('cicd', this)">CI/CD</button>
                    <button class="detail-tab-btn" onclick="switchTab('sforgs', this)">SF Org</button>
                </div>
                <div class="detail-tab-content active" id="tab-documentation">
                    <div class="doc-links">
                        ${linksHTML}
                    </div>
                </div>
                <div class="detail-tab-content" id="tab-git">
                    ${gitContentHTML}
                </div>
                <div class="detail-tab-content" id="tab-cicd">
                    ${cicdContentHTML}
                </div>
                <div class="detail-tab-content" id="tab-sforgs">
                    ${sforgsContentHTML}
                </div>
            `;
        }

        // Update releases sidebar
        function updateReleasesSidebar(product) {
            if (!product) return;

            const releasesContent = document.getElementById('releases-sidebar-content');
            const releaseHistory = product.releaseHistory || [];

            if (releaseHistory.length === 0) {
                releasesContent.innerHTML = `
                    <div class="releases-empty">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom: 1rem; opacity: 0.5;">
                            <path d="M9 12h6M9 16h6M17 21H7a2 2 0 01-2-2V5a2 2 0 012-2h10a2 2 0 012 2v14a2 2 0 01-2 2z"/>
                        </svg>
                        <p style="color: #999; font-size: 1rem; font-weight: 500;">No Release History</p>
                        <p style="color: #aaa; font-size: 0.9rem; margin-top: 0.5rem;">Release information will appear here when available</p>
                    </div>
                `;
            } else {
                releasesContent.innerHTML = releaseHistory.map(release => {
                    const releaseDate = new Date(release.date).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });

                    const externalIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>';

                    return `
                        <div class="release-card">
                            <div class="release-card-version">${release.releaseVersion || 'v' + release.version}</div>
                            <div class="release-card-date">${releaseDate}</div>
                            ${release.packageVersion ? `<div class="release-card-package">Package: ${release.packageVersion}</div>` : ''}
                            ${release.releaseNotesUrl ? `
                                <a href="${release.releaseNotesUrl}" target="_blank" class="release-card-link" rel="noopener noreferrer">
                                    📋 Release Notes ${externalIcon}
                                </a>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            }
        }

        // Switch between Documentation and Git tabs
        function switchTab(tabName, btnElement) {
            // Hide all tab contents
            document.querySelectorAll('.detail-tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            // Deactivate all tab buttons
            document.querySelectorAll('.detail-tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            // Activate selected tab
            document.getElementById('tab-' + tabName).classList.add('active');
            btnElement.classList.add('active');
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', loadDocumentation);
    </script>
</body>
</html>
